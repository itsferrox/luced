<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luced AI - Video Ranking Generator</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone (translates JSX directly in the browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Clean, crisp outline text styles avoiding WebkitTextStroke fill bugs */
    .rank-number-text {
      font-style: italic;
      text-shadow: 
        2px 2px 0 #000,
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000,
        0px 2px 0 #000,
        2px 0px 0 #000,
        0px -2px 0 #000,
        -2px 0px 0 #000,
        3px 3px 4px rgba(0,0,0,0.8);
    }

    .clip-title-text {
      color: #ffffff;
      text-shadow: 
        2px 2px 0 #000,
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000,
        0px 2px 0 #000,
        2px 0px 0 #000,
        0px -2px 0 #000,
        -2px 0px 0 #000,
        2px 3px 4px rgba(0,0,0,0.9);
    }

    /* Range slider custom styling for video cutter */
    input[type="range"]::-webkit-slider-thumb {
      pointer-events: auto;
      width: 16px;
      height: 24px;
      border-radius: 4px;
      background: #10b981;
      border: 2px solid #ffffff;
      cursor: pointer;
      -webkit-appearance: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    function App() {
      // --- STATE MANAGEMENT ---
      const [mainTitle, setMainTitle] = useState("");
      const [selectedColor, setSelectedColor] = useState("#5EE0B3");
      const [wordColors, setWordColors] = useState({});

      // Initial empty 5 slots
      const createInitialClips = () => [
        { id: 'clip-1', rank: 1, label: '', url: '', source: '', status: 'idle', duration: 15, startTime: 0, endTime: 15, isTrimmerOpen: false, isCutSaved: false },
        { id: 'clip-2', rank: 2, label: '', url: '', source: '', status: 'idle', duration: 15, startTime: 0, endTime: 15, isTrimmerOpen: false, isCutSaved: false },
        { id: 'clip-3', rank: 3, label: '', url: '', status: 'idle', duration: 15, startTime: 0, endTime: 15, isTrimmerOpen: false, isCutSaved: false },
        { id: 'clip-4', rank: 4, label: '', url: '', status: 'idle', duration: 15, startTime: 0, endTime: 15, isTrimmerOpen: false, isCutSaved: false },
        { id: 'clip-5', rank: 5, label: '', url: '', status: 'idle', duration: 15, startTime: 0, endTime: 15, isTrimmerOpen: false, isCutSaved: false },
      ];

      const [clips, setClips] = useState(createInitialClips());
      const [playbackOrder, setPlaybackOrder] = useState(['clip-1', 'clip-2', 'clip-3', 'clip-4', 'clip-5']);

      // Active Player & Preview State
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentOrderIndex, setCurrentOrderIndex] = useState(0);
      const [playbackProgress, setPlaybackProgress] = useState(0);
      const [isGenerating, setIsGenerating] = useState(false);
      const [exportProgress, setExportProgress] = useState(0);
      const [draggedIndex, setDraggedIndex] = useState(null);

      // Modal States for Safety Popups
      const [showResetModal, setShowResetModal] = useState(false);
      const [confirmAction, setConfirmAction] = useState(null); // { type: 'clear'|'edit', clipId: string }

      const videoRef = useRef(null);

      // Initialize Lucide icons on render
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Current active clip based on playback order
      const currentClipId = playbackOrder[currentOrderIndex];
      const currentClip = clips.find(c => c.id === currentClipId) || clips[0];

      const handleVideoEnded = () => {
        if (currentOrderIndex < playbackOrder.length - 1) {
          setCurrentOrderIndex(prev => prev + 1);
        } else {
          setCurrentOrderIndex(0);
        }
      };

      const handleTimeUpdate = () => {
        if (videoRef.current) {
          const current = videoRef.current.currentTime;
          const total = videoRef.current.duration || 1;
          setPlaybackProgress((current / total) * 100);
        }
      };

      const togglePlay = () => {
        if (videoRef.current) {
          if (isPlaying) {
            videoRef.current.pause();
          } else {
            videoRef.current.play();
          }
          setIsPlaying(!isPlaying);
        }
      };

      const shufflePlaybackOrder = () => {
        const shuffled = [...playbackOrder].sort(() => Math.random() - 0.5);
        setPlaybackOrder(shuffled);
        setCurrentOrderIndex(0);
      };

      const updateClip = (id, field, value) => {
        setClips(prev => prev.map(c => c.id === id ? { ...c, [field]: value } : c));
      };

      // File upload handler
      const handleFileUpload = (id, event) => {
        const file = event.target.files[0];
        if (!file) return;

        const fileUrl = URL.createObjectURL(file);
        
        // Calculate video duration dynamically
        const tempVideo = document.createElement('video');
        tempVideo.src = fileUrl;
        tempVideo.onloadedmetadata = () => {
          const dur = Math.round(tempVideo.duration) || 15;
          setClips(prev => prev.map(c => {
            if (c.id === id) {
              return {
                ...c,
                url: fileUrl,
                source: file.name,
                status: 'processed',
                duration: dur,
                startTime: 0,
                endTime: dur,
                isTrimmerOpen: true,
                isCutSaved: false
              };
            }
            return c;
          }));
        };
      };

      // Link process handler
      const processClip = (id) => {
        updateClip(id, 'status', 'processing');
        setTimeout(() => {
          setClips(prev => prev.map(c => {
            if (c.id === id) {
              return {
                ...c,
                status: 'processed',
                duration: 20,
                startTime: 0,
                endTime: 20,
                isTrimmerOpen: true,
                isCutSaved: false
              };
            }
            return c;
          }));
        }, 1200);
      };

      // Save trimmed length
      const saveClipCut = (id) => {
        setClips(prev => prev.map(c => c.id === id ? { ...c, isTrimmerOpen: false, isCutSaved: true } : c));
      };

      // Open modal before clearing clip
      const requestClearClip = (id) => {
        setConfirmAction({ type: 'clear', clipId: id });
      };

      // Open modal before editing cut
      const requestEditCut = (id) => {
        setConfirmAction({ type: 'edit', clipId: id });
      };

      // Confirm modal action
      const handleConfirmAction = () => {
        if (!confirmAction) return;

        if (confirmAction.type === 'clear') {
          setClips(prev => prev.map(c => {
            if (c.id === confirmAction.clipId) {
              return {
                ...c,
                url: '',
                source: '',
                status: 'idle',
                duration: 15,
                startTime: 0,
                endTime: 15,
                isTrimmerOpen: false,
                isCutSaved: false
              };
            }
            return c;
          }));
        } else if (confirmAction.type === 'edit') {
          setClips(prev => prev.map(c => {
            if (c.id === confirmAction.clipId) {
              return { ...c, isTrimmerOpen: true, isCutSaved: false };
            }
            return c;
          }));
        }

        setConfirmAction(null);
      };

      // Reset / New Video action
      const handleResetProject = () => {
        setMainTitle("");
        setWordColors({});
        setClips(createInitialClips());
        setPlaybackOrder(['clip-1', 'clip-2', 'clip-3', 'clip-4', 'clip-5']);
        setCurrentOrderIndex(0);
        setIsPlaying(false);
        setShowResetModal(false);
      };

      // Drag and Drop Handlers with Live Reordering
      const handleDragStart = (e, index) => {
        setDraggedIndex(index);
        e.dataTransfer.effectAllowed = "move";
      };

      const handleDragOver = (e) => {
        e.preventDefault();
      };

      const handleDragEnter = (e, targetIndex) => {
        e.preventDefault();
        if (draggedIndex === null || draggedIndex === targetIndex) return;

        const newOrder = [...playbackOrder];
        const draggedItem = newOrder[draggedIndex];
        newOrder.splice(draggedIndex, 1);
        newOrder.splice(targetIndex, 0, draggedItem);

        setPlaybackOrder(newOrder);
        setDraggedIndex(targetIndex);
      };

      const handleDragEnd = () => {
        setDraggedIndex(null);
      };

      const toggleWordColor = (globalWordIdx) => {
        setWordColors(prev => {
          const current = prev[globalWordIdx];
          if (current === selectedColor) {
            const copy = { ...prev };
            delete copy[globalWordIdx];
            return copy;
          }
          return { ...prev, [globalWordIdx]: selectedColor };
        });
      };

      const handleGenerateVideo = () => {
        setIsGenerating(true);
        setExportProgress(0);
        const interval = setInterval(() => {
          setExportProgress(prev => {
            if (prev >= 100) {
              clearInterval(interval);
              setIsGenerating(false);
              return 100;
            }
            return prev + 10;
          });
        }, 300);
      };

      const renderFormattedTitle = (isInteractive = false) => {
        if (!mainTitle.trim()) {
          return isInteractive ? <span className="text-slate-600 italic">Enter title above...</span> : null;
        }

        const lines = mainTitle.split('\n');
        let globalWordCounter = 0;

        return lines.map((line, lineIdx) => {
          const words = line.split(' ');
          return (
            <div key={lineIdx} className="block leading-tight">
              {words.map((word, wordIdx) => {
                const currentIdx = globalWordCounter++;
                const wordColor = wordColors[currentIdx] || '#FFFFFF';

                if (isInteractive) {
                  return (
                    <button
                      key={wordIdx}
                      type="button"
                      onClick={() => toggleWordColor(currentIdx)}
                      style={{ color: wordColor }}
                      className="inline-block px-1 py-0.5 m-0.5 rounded border border-slate-700 bg-slate-900 font-black hover:border-emerald-500 transition cursor-pointer"
                      title="Click to change color"
                    >
                      {word || ' '}
                    </button>
                  );
                }

                return (
                  <span key={wordIdx} style={{ color: wordColor }} className="font-extrabold inline-block mr-1.5">
                    {word}{' '}
                  </span>
                );
              })}
            </div>
          );
        });
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
          {/* Top Header */}
          <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur px-6 py-4 flex justify-between items-center sticky top-0 z-50">
            <div className="flex items-center gap-3">
              <div className="p-2 bg-gradient-to-tr from-emerald-500 to-teal-600 rounded-xl shadow-lg shadow-emerald-500/20">
                <i data-lucide="film" className="w-6 h-6 text-white"></i>
              </div>
              <h1 className="font-extrabold text-xl tracking-wider text-white">
                Luced AI
              </h1>
            </div>
          </header>

          {/* Studio View */}
          <div className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 p-6 max-w-[1800px] mx-auto w-full">
            
            {/* LEFT PANEL: Controls & Settings (7 Cols) */}
            <div className="lg:col-span-7 space-y-6">
              
              {/* BOX 1: TITLE */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                  <div className="flex items-center gap-2 text-emerald-400 font-bold text-base uppercase tracking-wider">
                    <i data-lucide="type" className="w-5 h-5"></i> Title
                  </div>
                </div>
                
                <div className="space-y-3">
                  <div className="space-y-1">
                    <label className="text-xs text-slate-400 font-medium">Main Title Text</label>
                    <textarea 
                      value={mainTitle}
                      onChange={(e) => setMainTitle(e.target.value)}
                      rows={2}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-base text-slate-100 font-bold focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition placeholder:text-slate-600"
                      placeholder="Enter your title here..."
                    />
                  </div>

                  {/* Color Palette Picker */}
                  <div className="flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <div className="flex items-center gap-2">
                      <span className="text-xs text-slate-400 font-medium">Active Color:</span>
                      <input 
                        type="color"
                        value={selectedColor}
                        onChange={(e) => setSelectedColor(e.target.value)}
                        className="w-8 h-8 bg-transparent border-0 cursor-pointer rounded"
                      />
                      <div className="flex gap-1.5 ml-1">
                        {['#5EE0B3', '#00FF66', '#FF2E63', '#FFD700', '#00F0FF', '#FFFFFF'].map((color) => (
                          <button 
                            key={color}
                            type="button"
                            onClick={() => setSelectedColor(color)}
                            style={{ backgroundColor: color }}
                            className={`w-6 h-6 rounded-full border transition hover:scale-110 ${
                              selectedColor === color ? 'border-white ring-2 ring-emerald-400' : 'border-white/20'
                            }`}
                          />
                        ))}
                      </div>
                    </div>

                    <span className="text-[11px] text-slate-400">Click any word below to apply active color</span>
                  </div>

                  {/* Word Highlight Selector */}
                  {mainTitle.trim().length > 0 && (
                    <div className="bg-slate-950/80 p-3 rounded-xl border border-slate-800">
                      <div className="text-xs font-medium text-slate-400 mb-2">Click word to color/uncolor:</div>
                      <div className="flex flex-wrap gap-1">
                        {renderFormattedTitle(true)}
                      </div>
                    </div>
                  )}
                </div>
              </div>

              {/* BOX 2: CLIP */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                <div className="flex items-center gap-2 text-emerald-400 font-bold text-base uppercase tracking-wider border-b border-slate-800 pb-2">
                  <i data-lucide="video" className="w-5 h-5"></i> Clip
                </div>

                <div className="space-y-4">
                  {clips.map((clip) => {
                    const hasClip = Boolean(clip.url);
                    const isCutSaved = clip.isCutSaved && !clip.isTrimmerOpen;

                    return (
                      <div key={clip.id} className="space-y-0">
                        {/* MAIN CLIP CARD */}
                        <div 
                          className={`p-3.5 rounded-xl border transition flex flex-col md:flex-row items-start md:items-center justify-between gap-3 ${
                            clip.isTrimmerOpen 
                              ? 'rounded-b-none border-b-0 border-emerald-500 bg-slate-800/90'
                              : currentClipId === clip.id 
                                ? 'bg-slate-800/80 border-emerald-500/50 shadow-lg shadow-emerald-950/30' 
                                : 'bg-slate-950/60 border-slate-800/80 hover:border-slate-700'
                          }`}
                        >
                          <div className="flex items-center gap-3 w-full md:w-auto flex-1">
                            <div className="w-8 h-8 rounded-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 font-black flex items-center justify-center text-xs flex-shrink-0">
                              #{clip.rank}
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-2 flex-1">
                              {/* Clip Name Input (Always Visible) */}
                              <input 
                                type="text"
                                value={clip.label}
                                onChange={(e) => updateClip(clip.id, 'label', e.target.value)}
                                placeholder="Clip Name / Title"
                                className="bg-slate-900 border border-slate-800 rounded px-3 py-1.5 text-xs text-white focus:outline-none focus:border-emerald-500 placeholder:text-slate-600"
                              />

                              {/* CONDITIONAL INPUTS: If clip is in and cut saved, show length instead of upload/link inputs */}
                              {hasClip && isCutSaved ? (
                                <div className="bg-emerald-950/40 border border-emerald-800/50 rounded px-3 py-1.5 text-xs text-emerald-400 font-medium flex items-center gap-1.5">
                                  <i data-lucide="scissors" className="w-3.5 h-3.5"></i>
                                  <span>Length: {clip.startTime}s - {clip.endTime}s ({clip.endTime - clip.startTime}s total)</span>
                                </div>
                              ) : !hasClip ? (
                                <div className="flex items-center gap-2">
                                  <input 
                                    type="text"
                                    value={clip.url}
                                    onChange={(e) => updateClip(clip.id, 'url', e.target.value)}
                                    placeholder="Paste Video Link"
                                    className="bg-slate-900 border border-slate-800 rounded px-3 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-emerald-500 placeholder:text-slate-600 flex-1"
                                  />

                                  {/* File Upload Option */}
                                  <label className="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded cursor-pointer border border-slate-700 flex items-center gap-1 whitespace-nowrap">
                                    <i data-lucide="upload" className="w-3.5 h-3.5 text-emerald-400"></i> Upload
                                    <input 
                                      type="file" 
                                      accept="video/*" 
                                      onChange={(e) => handleFileUpload(clip.id, e)} 
                                      className="hidden" 
                                    />
                                  </label>
                                </div>
                              ) : null}
                            </div>
                          </div>

                          {/* ACTION BUTTONS (Right side of card) */}
                          <div className="flex items-center gap-2 w-full md:w-auto justify-end border-t md:border-0 border-slate-800 pt-2 md:pt-0">
                            {/* Fetch button for link */}
                            {clip.url && clip.status === 'idle' && (
                              <button 
                                onClick={() => processClip(clip.id)}
                                className="px-2.5 py-1 bg-emerald-950 text-emerald-400 hover:bg-emerald-900 border border-emerald-800/50 rounded text-xs flex items-center gap-1 font-semibold"
                              >
                                <i data-lucide="refresh-cw" className="w-3 h-3"></i> Fetch
                              </button>
                            )}

                            {clip.status === 'processing' && (
                              <span className="px-2.5 py-1 bg-amber-950 text-amber-400 text-xs rounded flex items-center gap-1 animate-pulse">
                                <i data-lucide="refresh-cw" className="w-3 h-3 animate-spin"></i> Fetching...
                              </span>
                            )}

                            {/* Options when clip is loaded and cut is saved */}
                            {hasClip && isCutSaved && (
                              <>
                                <button 
                                  onClick={() => requestEditCut(clip.id)}
                                  className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded text-xs flex items-center gap-1 font-semibold transition"
                                >
                                  <i data-lucide="scissors" className="w-3 h-3 text-emerald-400"></i> Edit Cut
                                </button>
                                <button 
                                  onClick={() => requestClearClip(clip.id)}
                                  className="px-2.5 py-1 bg-rose-950/60 hover:bg-rose-900 border border-rose-800/50 text-rose-300 rounded text-xs flex items-center gap-1 font-semibold transition"
                                >
                                  <i data-lucide="trash-2" className="w-3 h-3"></i> Clear Box
                                </button>
                              </>
                            )}
                          </div>
                        </div>

                        {/* ATTACHED CONNECTED CUTTER / TRIMMER BOX */}
                        {hasClip && clip.isTrimmerOpen && (
                          <div className="bg-slate-900 border border-emerald-500 border-t-0 rounded-b-xl p-4 space-y-3 shadow-inner">
                            <div className="flex items-center justify-between text-xs font-bold text-slate-300">
                              <span className="flex items-center gap-1 text-emerald-400">
                                <i data-lucide="scissors" className="w-3.5 h-3.5"></i> Trim Video Clip Length
                              </span>
                              <span>Total Clip: {clip.duration}s</span>
                            </div>

                            {/* Dual Range Trimmer Bar */}
                            <div className="space-y-2">
                              <div className="relative w-full h-8 bg-slate-950 rounded-lg border border-slate-800 flex items-center px-2 overflow-hidden">
                                {/* Outside unselected region left */}
                                <div 
                                  style={{ width: `${(clip.startTime / clip.duration) * 100}%` }} 
                                  className="absolute left-0 top-0 bottom-0 bg-slate-950/80 backdrop-blur"
                                />

                                {/* Selected Active Green Region */}
                                <div 
                                  style={{ 
                                    left: `${(clip.startTime / clip.duration) * 100}%`,
                                    width: `${((clip.endTime - clip.startTime) / clip.duration) * 100}%`
                                  }} 
                                  className="absolute top-0 bottom-0 bg-emerald-500/20 border-l-4 border-r-4 border-emerald-500 shadow-[0_0_12px_rgba(16,185,129,0.3)]"
                                />

                                {/* Outside unselected region right */}
                                <div 
                                  style={{ width: `${100 - (clip.endTime / clip.duration) * 100}%` }} 
                                  className="absolute right-0 top-0 bottom-0 bg-slate-950/80 backdrop-blur"
                                />

                                {/* Slider Handles */}
                                <input 
                                  type="range" 
                                  min="0" 
                                  max={clip.endTime - 1} 
                                  value={clip.startTime} 
                                  onChange={(e) => updateClip(clip.id, 'startTime', Math.min(Number(e.target.value), clip.endTime - 1))}
                                  className="absolute inset-0 w-full opacity-0 cursor-pointer z-20 pointer-events-none"
                                />
                                <input 
                                  type="range" 
                                  min={clip.startTime + 1} 
                                  max={clip.duration} 
                                  value={clip.endTime} 
                                  onChange={(e) => updateClip(clip.id, 'endTime', Math.max(Number(e.target.value), clip.startTime + 1))}
                                  className="absolute inset-0 w-full opacity-0 cursor-pointer z-20 pointer-events-none"
                                />
                              </div>

                              {/* Handles Second Indicators */}
                              <div className="flex justify-between items-center text-[11px] font-mono font-bold text-slate-400 px-1">
                                <span>Start: <strong className="text-emerald-400">{clip.startTime}s</strong></span>
                                <span className="text-slate-500">Selected: {clip.endTime - clip.startTime}s</span>
                                <span>End: <strong className="text-emerald-400">{clip.endTime}s</strong></span>
                              </div>
                            </div>

                            {/* Keep / Save Length Button */}
                            <div className="flex justify-end pt-1">
                              <button 
                                onClick={() => saveClipCut(clip.id)}
                                className="px-4 py-1.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs rounded-lg flex items-center gap-1.5 shadow transition"
                              >
                                <i data-lucide="check" className="w-3.5 h-3.5"></i> Keep This Length
                              </button>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* BOX 3: ORDER */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                  <div className="flex items-center gap-2 text-emerald-400 font-bold text-base uppercase tracking-wider">
                    <i data-lucide="shuffle" className="w-5 h-5"></i> Order
                  </div>

                  <button 
                    onClick={shufflePlaybackOrder}
                    className="px-3.5 py-1.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-slate-950 font-bold text-xs rounded-lg flex items-center gap-1.5 shadow transition"
                  >
                    <i data-lucide="shuffle" className="w-3.5 h-3.5"></i> Auto-Shuffle Order
                  </button>
                </div>

                {/* Playback Queue Display */}
                <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-1.5">
                  {playbackOrder.map((clipId, idx) => {
                    const item = clips.find(c => c.id === clipId);
                    if (!item) return null;
                    const isCurrent = idx === currentOrderIndex;
                    const isBeingDragged = draggedIndex === idx;

                    return (
                      <div 
                        key={clipId}
                        draggable
                        onDragStart={(e) => handleDragStart(e, idx)}
                        onDragOver={handleDragOver}
                        onDragEnter={(e) => handleDragEnter(e, idx)}
                        onDragEnd={handleDragEnd}
                        className={`p-2.5 rounded-lg border text-xs flex items-center justify-between transition-all duration-200 cursor-grab active:cursor-grabbing ${
                          isCurrent 
                            ? 'bg-emerald-950/40 border-emerald-500/60 text-white font-medium' 
                            : 'bg-slate-900 border-slate-800/80 text-slate-400 hover:border-slate-700'
                        } ${isBeingDragged ? 'scale-[1.02] border-emerald-400 bg-emerald-950/60 shadow-lg' : ''}`}
                      >
                        <div className="flex items-center gap-3">
                          <span className="w-5 text-slate-500 font-mono text-center">[{idx + 1}]</span>
                          <span className="px-2.5 py-1 bg-slate-800 text-emerald-400 font-extrabold text-sm rounded">
                            Rank #{item.rank}
                          </span>
                          {isCurrent && (
                            <span className="px-2 py-0.5 bg-emerald-500 text-slate-950 font-black text-[10px] rounded uppercase animate-pulse">
                              PLAYING
                            </span>
                          )}
                        </div>

                        <div className="flex items-center gap-1 text-slate-500 hover:text-slate-300">
                          <i data-lucide="grip-vertical" className="w-4 h-4"></i>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* RIGHT PANEL: Live Mobile Preview Player (5 Cols) */}
            <div className="lg:col-span-5 flex flex-col items-center justify-start space-y-4 sticky top-24 self-start">
              <div className="text-center">
                <span className="text-xs font-bold text-emerald-400 uppercase tracking-widest bg-emerald-950/60 border border-emerald-800/40 px-3 py-1 rounded-full">
                  Live Preview
                </span>
              </div>

              {/* 9:16 Vertical Canvas Frame */}
              <div className="relative w-[320px] h-[570px] bg-black p-0 shadow-2xl border-4 border-slate-800 flex flex-col overflow-hidden ring-1 ring-slate-700/50 rounded-xl">
                {/* Inner Screen */}
                <div className="relative w-full h-full bg-slate-950 overflow-hidden flex flex-col justify-between">
                  
                  {/* VIDEO DISPLAY ELEMENT */}
                  {currentClip?.url ? (
                    <video 
                      ref={videoRef}
                      src={currentClip.url}
                      className="absolute inset-0 w-full h-full object-cover"
                      onEnded={handleVideoEnded}
                      onTimeUpdate={handleTimeUpdate}
                      muted
                      playsInline
                      autoPlay
                    />
                  ) : (
                    <div className="absolute inset-0 bg-slate-900 flex flex-col items-center justify-center text-slate-600 text-xs p-4 text-center">
                      <i data-lucide="video" className="w-8 h-8 mb-2 opacity-40"></i>
                      <span>Paste link or upload clip in Box 2</span>
                    </div>
                  )}

                  {/* OVERLAY 1: Sticky Top Black Box Main Title */}
                  <div className="absolute top-0 left-0 w-full z-10 bg-black pt-5 pb-3 px-3 text-center border-b border-black min-h-[50px] flex items-center justify-center">
                    <h2 className="text-[26px] font-black tracking-tight text-white leading-tight uppercase">
                      {renderFormattedTitle(false)}
                    </h2>
                  </div>

                  {/* OVERLAY 2: Ranks 1-5 Left Side & Dynamic Name */}
                  <div className="absolute top-[28%] left-3 z-10 flex flex-col gap-3">
                    {[1, 2, 3, 4, 5].map((rankNum) => {
                      const isCurrent = currentClip?.rank === rankNum;
                      const item = clips.find(c => c.rank === rankNum);
                      
                      const rankColors = {
                        1: '#FFD700', // Gold
                        2: '#C0C0C0', // Silver
                        3: '#CD7F32', // Bronze
                        4: '#A0A0A0', // Grayish
                        5: '#707070'  // Grayish
                      };

                      return (
                        <div key={rankNum} className="flex items-center gap-3 h-9">
                          <span 
                            style={{ color: rankColors[rankNum] }} 
                            className="rank-number-text text-2xl font-black italic tracking-tighter"
                          >
                            {rankNum}.
                          </span>
                          
                          {/* Only show clip name if active and provided */}
                          {isCurrent && item?.label && (
                            <span className="clip-title-text font-black text-base tracking-wide lowercase">
                              {item.label}
                            </span>
                          )}
                        </div>
                      )
                    })}
                  </div>

                  {/* OVERLAY 3: Bottom Video Progress Bar */}
                  <div className="relative z-10 w-full bg-slate-900/60 h-1.5 mt-auto">
                    <div 
                      style={{ width: `${playbackProgress}%` }}
                      className="bg-emerald-400 h-full transition-all duration-100 ease-linear shadow-[0_0_8px_#34D399]"
                    />
                  </div>
                </div>

                {/* Player Floating Control Bar */}
                <div className="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 flex items-center gap-2 bg-slate-900/90 backdrop-blur border border-slate-700 px-3 py-1.5 rounded-full shadow-2xl">
                  <button 
                    onClick={togglePlay}
                    className="p-1.5 bg-emerald-500 text-slate-950 rounded-full hover:scale-105 transition"
                  >
                    {isPlaying ? <i data-lucide="pause" className="w-4 h-4"></i> : <i data-lucide="play" className="w-4 h-4 fill-slate-950"></i>}
                  </button>
                  <span className="text-[11px] font-mono text-slate-300">
                    {isPlaying ? 'Playing' : 'Paused'}
                  </span>
                </div>
              </div>

              {/* ACTION BUTTONS (Export & New Video) */}
              <div className="w-[320px] space-y-2.5">
                <button 
                  onClick={handleGenerateVideo}
                  disabled={isGenerating}
                  className="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-black text-base rounded-2xl flex items-center justify-center gap-2 shadow-xl shadow-emerald-500/20 transition active:scale-[0.98] disabled:opacity-50"
                >
                  {isGenerating ? (
                    <>
                      <i data-lucide="refresh-cw" className="w-5 h-5 animate-spin"></i> Rendering ({exportProgress}%)
                    </>
                  ) : (
                    <>
                      <i data-lucide="download" className="w-5 h-5"></i> Export Video
                    </>
                  )}
                </button>

                <button 
                  onClick={() => setShowResetModal(true)}
                  className="w-full py-3 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 hover:text-white font-bold text-sm rounded-2xl flex items-center justify-center gap-2 transition active:scale-[0.98]"
                >
                  <i data-lucide="plus-circle" className="w-4 h-4 text-emerald-400"></i> New Video
                </button>
              </div>
            </div>
          </div>

          {/* CONFIRMATION MODAL FOR NEW VIDEO */}
          {showResetModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full space-y-4 shadow-2xl animate-in fade-in zoom-in-95 duration-150">
                <div className="flex items-center gap-3 text-amber-400">
                  <i data-lucide="alert-triangle" className="w-6 h-6 flex-shrink-0"></i>
                  <h3 className="font-bold text-white text-base">Start a New Video?</h3>
                </div>
                <div className="flex items-center gap-3 pt-2">
                  <button 
                    onClick={() => setShowResetModal(false)}
                    className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs rounded-xl transition"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={handleResetProject}
                    className="flex-1 py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs rounded-xl transition shadow-lg shadow-rose-950/50"
                  >
                    Yes, Clear All
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* CONFIRMATION MODAL FOR CLIP EDIT / CLEAR ACTIONS */}
          {confirmAction && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full space-y-4 shadow-2xl animate-in fade-in zoom-in-95 duration-150">
                <div className="flex items-center gap-3 text-amber-400">
                  <i data-lucide="alert-triangle" className="w-6 h-6 flex-shrink-0"></i>
                  <h3 className="font-bold text-white text-base">
                    {confirmAction.type === 'clear' ? 'Clear Clip Slot?' : 'Edit Cut Length?'}
                  </h3>
                </div>
                <div className="flex items-center gap-3 pt-2">
                  <button 
                    onClick={() => setConfirmAction(null)}
                    className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs rounded-xl transition"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={handleConfirmAction}
                    className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold text-xs rounded-xl transition shadow-lg shadow-emerald-950/50"
                  >
                    Confirm
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
